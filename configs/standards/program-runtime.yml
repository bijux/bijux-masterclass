    - shared/bijux-makes
    - shared/bijux-checks
  python:
    - shared/bijux-makes-py
remote:
  repo_url: https://github.com/bijux/bijux-std
  git_url: https://github.com/bijux/bijux-std.git
  default_ref: 1ad55aafdb44e2d47890632653e7d9c312cc7968
  tag_pattern: v*
