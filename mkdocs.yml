INHERIT: mkdocs.shared.yml

site_name: Bijux Masterclass
site_description: Unified catalog for the Bijux Masterclass program collection.
site_author: Bijan Mousavi <bijan@bijux.io>
site_url: !ENV [SITE_URL, https://bijux.io/bijux-masterclass/]
repo_name: bijux/bijux-masterclass
repo_url: https://github.com/bijux/bijux-masterclass
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: artifacts/site/bijux-masterclass
watch:
  - docs
  - docs/assets
  - docs/overrides
  - .bijux/shared/bijux-docs
  - mkdocs.yml
  - mkdocs.shared.yml

extra:
  bijux:
    repository: bijux-masterclass
    nav_mode: default
    theme_key: bijux:theme
nav:
  - Home: index.md
  - Reproducible Research: reproducible-research/index.md
  - Python Programming: python-programming/index.md

extra_javascript:
  - assets/javascripts/mermaid-init.js
  - assets/javascripts/shell/theme-persistence.js
  - assets/javascripts/shell/viewport-profile.js
  - assets/javascripts/shell/nav-state.js
  - assets/javascripts/shell/detail-tabs.js
  - assets/javascripts/shell/nav-reveal.js
  - assets/javascripts/shell/search-recovery.js
  - assets/javascripts/shell/content-reflow.js
  - assets/javascripts/external-links.js
  - assets/javascripts/shell/bootstrap.js
  - assets/javascripts/navigation-sync.js
  - assets/javascripts/navigation/offsite-targets.js
exclude_docs: |
  /overrides/
  /hooks/
  /assets/styles/README.md
  /assets/javascripts/shell/README.md
