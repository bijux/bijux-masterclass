openapi: 3.1.2
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Analysis Runs API
  summary: Contract-first training API for asynchronous analysis workflows.
  description: The cumulative capstone for OpenAPI Contract Engineering. The description is canonical;
    the Python and TypeScript services are independently tested providers.
  version: 1.1.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  contact:
    name: Bijux Masterclass
servers:
- url: http://127.0.0.1:8000
  description: Python/FastAPI provider
- url: http://127.0.0.1:3000
  description: TypeScript/Fastify provider
- url: http://127.0.0.1:4010
  description: Prism mock
tags:
- name: System
  description: Service health and public process status.
- name: Projects
  description: Owned project resources and conditional updates.
- name: Datasets
  description: Dataset metadata and multipart content upload.
- name: Analysis Runs
  description: Asynchronous analysis lifecycle and progress.
- name: Artifacts
  description: Outputs produced by completed analysis runs.
- name: Webhooks
  description: Subscription and event-delivery contracts.
- name: Internal
  description: Administrative training diagnostics.
security:
- OAuth2: []
- ApiKey: []
paths:
  /health:
    get:
      tags:
      - System
      summary: Check service health
      description: Returns process health without exposing internal diagnostics.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The service is healthy.
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              schema:
                type: string
                pattern: ^req_[a-f0-9]{12}$
              example: req_012345abcdef
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - service
                - version
                - time
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: analysis-runs-api
                  version:
                    type: string
                    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
                  time:
                    type: string
                    format: date-time
                examples:
                - status: ok
                  service: analysis-runs-api
                  version: 1.0.0
                  time: '2026-08-05T10:00:00Z'
              example:
                status: ok
                service: analysis-runs-api
                version: 1.0.0
                time: '2026-08-05T10:00:00Z'
  /projects:
    get:
      tags:
      - Projects
      summary: List projects
      description: Returns only projects owned by the authenticated principal.
      operationId: listProjects
      security:
      - OAuth2:
        - projects:read
      - ApiKey: []
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of records to return.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        example: 20
      - name: cursor
        in: query
        required: false
        description: Opaque continuation cursor returned by the preceding page.
        schema:
          type: string
          pattern: ^[0-9]+$
        example: '20'
      - name: name
        in: query
        required: false
        description: Case-insensitive project-name substring.
        schema:
          type: string
          minLength: 1
          maxLength: 80
        example: summer
      responses:
        '200':
          description: A cursor-paginated project page.
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              schema:
                type: string
                pattern: ^req_[a-f0-9]{12}$
              example: req_012345abcdef
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - id
                      - ownerId
                      - name
                      - description
                      - version
                      - createdAt
                      - updatedAt
                      properties:
                        id:
                          type: string
                          pattern: ^prj_[0-9]{4,18}$
                          readOnly: true
                        ownerId:
                          type: string
                          pattern: ^[a-z][a-z0-9-]{2,31}$
                          readOnly: true
                        name:
                          type: string
                          minLength: 1
                          maxLength: 80
                        description:
                          type:
                          - string
                          - 'null'
                          maxLength: 500
                        version:
                          type: integer
                          minimum: 1
                          readOnly: true
                        createdAt:
                          type: string
                          format: date-time
                          readOnly: true
                        updatedAt:
                          type: string
                          format: date-time
                          readOnly: true
                      examples:
                      - id: prj_0001
                        ownerId: learner
                        name: Summer cohort
                        description: Quality analysis for the August cohort.
                        version: 1
                        createdAt: '2026-08-05T10:00:00Z'
                        updatedAt: '2026-08-05T10:00:00Z'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    pattern: ^[0-9]+$
                examples:
                - items:
                  - id: prj_0001
                    ownerId: learner
                    name: Summer cohort
                    description: Quality analysis for the August cohort.
                    version: 1
                    createdAt: '2026-08-05T10:00:00Z'
                    updatedAt: '2026-08-05T10:00:00Z'
                  nextCursor: null
        '401':
          description: Authentication required
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              schema:
                type: string
                pattern: ^req_[a-f0-9]{12}$
              example: req_012345abcdef
          content:
            application/problem+json:
              schema:
                type: object
                additionalProperties: true
                required:
                - type
                - title
                - status
                - detail
                - instance
                - requestId
                properties:
                  type:
                    type: string
                    format: uri-reference
                  title:
                    type: string
                    minLength: 1
                    maxLength: 120
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                  detail:
                    type: string
                    minLength: 1
                    maxLength: 1000
                  instance:
                    type: string
                    format: uri-reference
                  requestId:
                    type: string
                    pattern: ^req_[a-f0-9]{12}$
                examples:
                - type: https://api.example.test/problems/not-found
                  title: Resource not found
                  status: 404
                  detail: The requested resource does not exist.
                  instance: /projects/prj_9999
                  requestId: req_012345abcdef
              example:
                type: https://api.example.test/problems/unauthorized
                title: Authentication required
                status: 401
                detail: Valid authentication credentials are required.
                instance: /example
                requestId: req_012345abcdef
        '403':
          description: Permission denied
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              schema:
                type: string
                pattern: ^req_[a-f0-9]{12}$
              example: req_012345abcdef
          content:
            application/problem+json:
              schema:
                type: object
                additionalProperties: true
                required:
                - type
                - title
                - status
                - detail
                - instance
                - requestId
                properties:
                  type:
                    type: string
                    format: uri-reference
                  title:
                    type: string
                    minLength: 1
                    maxLength: 120
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                  detail:
                    type: string
                    minLength: 1
                    maxLength: 1000
                  instance:
                    type: string
                    format: uri-reference
                  requestId:
                    type: string
                    pattern: ^req_[a-f0-9]{12}$
                examples:
                - type: https://api.example.test/problems/not-found
                  title: Resource not found
                  status: 404
                  detail: The requested resource does not exist.
                  instance: /projects/prj_9999
                  requestId: req_012345abcdef
              example:
                type: https://api.example.test/problems/forbidden
                title: Permission denied
                status: 403
                detail: The authenticated principal lacks the required permission.
                instance: /example
                requestId: req_012345abcdef
        '422':
          description: Request validation failed.
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              schema:
                type: string
                pattern: ^req_[a-f0-9]{12}$
              example: req_012345abcdef
          content:
            application/problem+json:
              schema:
                type: object
                additionalProperties: false
                required:
                - type
                - title
                - status
                - detail
                - instance
                - requestId
                - errors
                properties:
                  type:
                    type: string
                    format: uri-reference
                  title:
                    type: string
                    minLength: 1
                    maxLength: 120
                  status:
                    type: integer
                    const: 422
                  detail:
                    type: string
                    minLength: 1
                    maxLength: 1000
                  instance:
                    type: string
                    format: uri-reference
                  requestId:
                    type: string
                    pattern: ^req_[a-f0-9]{12}$
                  errors:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - location
                      - message
                      - code
                      properties:
                        location:
                          type: array
                          minItems: 1
                          items:
                            type:
                            - string
                            - integer
                        message:
                          type: string
                          minLength: 1
                          maxLength: 300
                        code:
                          type: string
                          minLength: 1
                          maxLength: 80
                examples:
                - type: https://api.example.test/problems/validation
                  title: Request validation failed
                  status: 422
                  detail: One or more request values are invalid.
                  instance: /projects
                  requestId: req_012345abcdef
                  errors:
                  - location:
                    - body
                    - name
                    message: String should have at least 1 character
                    code: string_too_short
