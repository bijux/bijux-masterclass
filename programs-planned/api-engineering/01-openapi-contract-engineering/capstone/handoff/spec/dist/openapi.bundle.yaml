  /webhook-subscriptions:
    post:
      tags:
      - Webhooks
      summary: Create a webhook subscription
      description: Stores a constrained HTTPS destination. The secret is accepted once and never returned.
      operationId: createWebhookSubscription
      security:
      - OAuth2:
        - webhooks:write
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - targetUrl
              - eventTypes
              - secret
              properties:
                targetUrl:
                  type: string
                  format: uri
                  pattern: ^https://hooks\.example\.test(?:/[^#\s]*)?$
                eventTypes:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - analysis.completed
                    - analysis.failed
