    post:
      tags:
      - Projects
      summary: Create a project
      description: Creates a project owned by the authenticated principal.
      operationId: createProject
      security:
      - OAuth2:
        - projects:write
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  pattern: ^\S(?:.*\S)?$
                description:
                  type: string
                  maxLength: 500
              examples:
              - name: Summer cohort
                description: Quality analysis for the August cohort.
            example:
              name: Summer cohort
              description: Quality analysis for the August cohort.
      responses:
        '201':
          description: Project created.
          headers:
            Location:
              description: Canonical URI of the created or accepted resource.
              schema:
                type: string
                format: uri-reference
              example: /analysis-runs/run_0001
            ETag:
              description: Strong entity tag for conditional project updates.
              schema:
                type: string
                pattern: ^"prj_[0-9]{4,18}:[0-9]+"$
