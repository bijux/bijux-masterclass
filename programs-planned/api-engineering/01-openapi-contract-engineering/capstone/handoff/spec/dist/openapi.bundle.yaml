      - Projects
      summary: Conditionally update a project
      description: Applies a partial update only when If-Match identifies the current version.
      operationId: updateProject
      security:
      - OAuth2:
        - projects:write
      - ApiKey: []
      parameters:
      - name: If-Match
        in: header
        required: true
        description: Strong entity tag obtained from the latest project representation.
        schema:
          type: string
          pattern: ^"prj_[0-9]{4,18}:[0-9]+"$
        example: '"prj_0001:1"'
      requestBody:
        required: true
        content:
