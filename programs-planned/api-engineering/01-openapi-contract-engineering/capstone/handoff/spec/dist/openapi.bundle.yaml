      - OAuth2:
        - admin
      x-audience: internal
      responses:
        '200':
          description: In-memory object counts and simulated outbound events.
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              schema:
                type: string
                pattern: ^req_[a-f0-9]{12}$
              example: req_012345abcdef
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - counts
                - outboundEvents
                properties:
                  counts:
                    type: object
                    additionalProperties: false
                    required:
                    - projects
                    - datasets
                    - runs
                    - artifacts
                    - subscriptions
                    properties:
                      projects:
                        type: integer
                        minimum: 0
                      datasets:
                        type: integer
                        minimum: 0
