    get:
      tags:
      - Analysis Runs
      summary: List analysis runs
      description: Returns owned runs, optionally filtered by status.
      operationId: listAnalysisRuns
      security:
      - OAuth2:
        - runs:read
      - ApiKey: []
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of records to return.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        example: 20
      - name: cursor
        in: query
        required: false
        description: Opaque continuation cursor returned by the preceding page.
        schema:
          type: string
          pattern: ^[0-9]+$
        example: '20'
      - name: status
        in: query
        required: false
        description: Return runs in one lifecycle state.
        schema:
