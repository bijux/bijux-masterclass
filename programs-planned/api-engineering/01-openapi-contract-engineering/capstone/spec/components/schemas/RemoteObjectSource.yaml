type: object
additionalProperties: false
required:
- kind
- uri
properties:
  kind:
    type: string
    const: remote-object
  uri:
    type: string
    format: uri
    pattern: ^https://objects\.example\.test/[^?#\s]+$
  checksumSha256:
    type: string
    pattern: ^[a-f0-9]{64}$
examples:
- kind: remote-object
  uri: https://objects.example.test/cohort/reads.csv
  checksumSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
