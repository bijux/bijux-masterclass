type: object
additionalProperties: false
required:
- id
- ownerId
- targetUrl
- eventTypes
- secretHint
- createdAt
properties:
  id:
    type: string
    pattern: ^whs_[0-9]{4,18}$
    readOnly: true
  ownerId:
    type: string
    pattern: ^[a-z][a-z0-9-]{2,31}$
    readOnly: true
  targetUrl:
    type: string
    format: uri
    pattern: '^https://hooks\.example\.test(?:/[^#\s]*)?$'
  eventTypes:
    type: array
    minItems: 1
    maxItems: 2
    uniqueItems: true
    items:
      type: string
      enum:
      - analysis.completed
      - analysis.failed
  secretHint:
    type: string
    pattern: ^\*{4}.{4}$
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
