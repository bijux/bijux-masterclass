type: object
additionalProperties: false
required:
- id
- ownerId
- name
- description
- version
- createdAt
- updatedAt
properties:
  id:
    type: string
    pattern: ^prj_[0-9]{4,18}$
    readOnly: true
  ownerId:
    type: string
    pattern: ^[a-z][a-z0-9-]{2,31}$
    readOnly: true
  name:
    type: string
    minLength: 1
    maxLength: 80
  description:
    type:
    - string
    - 'null'
    maxLength: 500
  version:
    type: integer
    minimum: 1
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
examples:
- id: prj_0001
  ownerId: learner
  name: Summer cohort
  description: Quality analysis for the August cohort.
  version: 1
  createdAt: '2026-08-05T10:00:00Z'
  updatedAt: '2026-08-05T10:00:00Z'
