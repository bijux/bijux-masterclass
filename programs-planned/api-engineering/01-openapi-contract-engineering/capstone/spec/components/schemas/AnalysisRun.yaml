type: object
additionalProperties: false
required:
- id
- projectId
- datasetId
- ownerId
- status
- parameters
- progress
- createdAt
- updatedAt
- completedAt
- artifactIds
properties:
  id:
    type: string
    pattern: ^run_[0-9]{4,18}$
    readOnly: true
  projectId:
    type: string
    pattern: ^prj_[0-9]{4,18}$
  datasetId:
    type: string
    pattern: ^dts_[0-9]{4,18}$
  ownerId:
    type: string
    pattern: ^[a-z][a-z0-9-]{2,31}$
    readOnly: true
  status:
    type: string
    enum:
    - queued
    - running
    - completed
    - failed
    - canceled
    readOnly: true
  parameters:
    $ref: ./AnalysisParameters.yaml
  progress:
    type: integer
    minimum: 0
    maximum: 100
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
  completedAt:
    type:
    - string
    - 'null'
    format: date-time
    readOnly: true
  artifactIds:
    type: array
    maxItems: 10
    items:
      type: string
      pattern: ^art_[0-9]{4,18}$
    readOnly: true
  callbackUrl:
    type:
    - string
    - 'null'
    format: uri
    pattern: '^https://hooks\.example\.test(?:/[^#\s]*)?$'
    writeOnly: true
examples:
- id: run_0001
  projectId: prj_0001
  datasetId: dts_0001
  ownerId: learner
  status: running
  parameters:
    algorithm: quality-summary
    priority: normal
  progress: 50
  createdAt: '2026-08-05T10:10:00Z'
  updatedAt: '2026-08-05T10:11:00Z'
  completedAt: null
  artifactIds: []
