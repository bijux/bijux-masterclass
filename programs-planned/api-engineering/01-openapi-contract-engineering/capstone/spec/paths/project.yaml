parameters:
- $ref: ../components/parameters/ProjectId.yaml
get:
  tags:
  - Projects
  summary: Retrieve a project
  description: Returns the current project representation and entity tag.
  operationId: getProject
  security:
  - OAuth2:
    - projects:read
  - ApiKey: []
  responses:
    '200':
      description: Current project representation.
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
        X-Request-Id:
          $ref: ../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Project.yaml
          example:
            id: prj_0001
            ownerId: learner
            name: Summer cohort
            description: Quality analysis for the August cohort.
            version: 1
            createdAt: '2026-08-05T10:00:00Z'
            updatedAt: '2026-08-05T10:00:00Z'
    '401':
      $ref: ../components/responses/UnauthorizedProblem.yaml
    '403':
      $ref: ../components/responses/ForbiddenProblem.yaml
    '404':
      $ref: ../components/responses/NotFoundProblem.yaml
    '422':
      $ref: ../components/responses/ValidationProblemResponse.yaml
patch:
  tags:
  - Projects
  summary: Conditionally update a project
  description: Applies a partial update only when If-Match identifies the current version.
  operationId: updateProject
  security:
  - OAuth2:
    - projects:write
  - ApiKey: []
  parameters:
  - $ref: ../components/parameters/IfMatch.yaml
  requestBody:
    required: true
    content:
      application/merge-patch+json:
        schema:
          $ref: ../components/schemas/ProjectPatch.yaml
        example:
          description: Revised cohort description.
  responses:
    '200':
      description: Updated project representation.
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
        X-Request-Id:
          $ref: ../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Project.yaml
    '401':
      $ref: ../components/responses/UnauthorizedProblem.yaml
    '403':
      $ref: ../components/responses/ForbiddenProblem.yaml
    '404':
      $ref: ../components/responses/NotFoundProblem.yaml
    '412':
      $ref: ../components/responses/PreconditionProblem.yaml
    '428':
      $ref: ../components/responses/PreconditionRequiredProblem.yaml
    '422':
      $ref: ../components/responses/ValidationProblemResponse.yaml
