[auth]
header = "Authorization"
value = "Bearer learner-write"

[generation]
mode = "all"

[checks]
enabled = [
  "not_a_server_error",
  "status_code_conformance",
  "content_type_conformance",
  "response_headers_conformance",
  "response_schema_conformance",
]

[phases]
enabled = ["examples", "coverage", "fuzzing", "stateful"]
