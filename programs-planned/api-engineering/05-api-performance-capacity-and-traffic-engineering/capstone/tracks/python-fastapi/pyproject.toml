[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api-performance-course"
version = "1.0.0"
description = "Dependency-light performance engineering mechanisms for the Analysis Runs course"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
provider = [
  "fastapi==0.162.0",
  "starlette==1.3.1",
  "pydantic==2.13.4",
  "uvicorn==0.48.0",
  "httpx==0.28.1",
]
postgres = ["psycopg[binary]==3.3.4"]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests_performance"]
addopts = "-q"
