dependencies:
- id: postgres
  criticality: hard
  retryOwner: repository-adapter
  attempts: 1
  perAttemptTimeoutMs: 800
  circuitBreaker: false
  bulkhead: connection-pool
  fallback: none
  readiness: true
- id: artifact-store
  criticality: hard-for-completion
  retryOwner: worker
  attempts: 3
  perAttemptTimeoutMs: 1500
  circuitBreaker: true
  bulkhead: artifact-writes
  fallback: fail-run-without-publishing
  readiness: false
  circuitScope: dependency
- id: webhook-receiver
  criticality: soft
  retryOwner: dispatcher
  attempts: 6
  perAttemptTimeoutMs: 2000
  circuitBreaker: true
  bulkhead: webhook-host
  fallback: durable-retry
  readiness: false
  circuitScope: dependency
- id: otel-collector
  criticality: diagnostic
  retryOwner: sdk-exporter
  attempts: bounded-queue
  perAttemptTimeoutMs: 1000
  circuitBreaker: false
  bulkhead: export-queue
  fallback: drop-and-count
  readiness: false
