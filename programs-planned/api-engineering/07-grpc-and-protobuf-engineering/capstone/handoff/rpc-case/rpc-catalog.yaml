version: '1.0'
package: bijux.analysis.v1
methods:
- path: /bijux.analysis.v1.AnalysisControlService/CreateRun
  shape: unary
  owner: analysis-control
  state_owner: analysis-control
  deadline_owner: http-edge
  retry: durable-idempotency
  idempotency: true
  scope: runs:write
  max_request_bytes: 8192
  max_response_bytes: 65536
- path: /bijux.analysis.v1.AnalysisControlService/GetRun
  shape: unary
  owner: analysis-control
  state_owner: analysis-control
  deadline_owner: caller
  retry: safe-read
  idempotency: false
  scope: runs:read
  max_request_bytes: 4096
  max_response_bytes: 65536
- path: /bijux.analysis.v1.AnalysisControlService/CancelRun
  shape: unary
  owner: analysis-control
  state_owner: analysis-control
  deadline_owner: http-edge
  retry: durable-idempotency
  idempotency: true
  scope: runs:write
  max_request_bytes: 8192
  max_response_bytes: 65536
- path: /bijux.analysis.v1.AnalysisControlService/WatchRun
  shape: server-stream
  owner: analysis-control
  state_owner: analysis-control
  deadline_owner: subscriber
  retry: resume
  idempotency: false
  scope: runs:read
  max_request_bytes: 4096
  max_message_bytes: 65536
- path: /bijux.analysis.v1.DatasetTransferService/UploadDataset
  shape: client-stream
  owner: dataset-transfer
  state_owner: analysis-control
  deadline_owner: caller
  retry: durable-idempotency
  idempotency: true
  scope: datasets:write
  max_message_bytes: 65536
  max_stream_bytes: 2097152
- path: /bijux.analysis.v1.DatasetTransferService/DownloadArtifact
  shape: server-stream
  owner: dataset-transfer
  state_owner: analysis-control
  deadline_owner: caller
  retry: resume
  idempotency: false
  scope: artifacts:read
  max_request_bytes: 4096
  max_message_bytes: 65536
- path: /bijux.analysis.v1.WorkerPlaneService/Work
  shape: bidi-stream
  owner: worker-plane
  state_owner: analysis-control
  deadline_owner: worker-session
  retry: resume
  idempotency: false
  scope: worker:connect
  max_message_bytes: 65536
  max_stream_age_seconds: 3600
