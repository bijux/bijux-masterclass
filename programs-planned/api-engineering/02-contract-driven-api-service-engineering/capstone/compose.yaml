name: cdse-analysis-runs
services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analysis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analysis}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analysis} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  receiver:
    build: ./webhook-receiver
    environment:
      RECEIVER_SECRET: ${CALLBACK_SIGNING_SECRET:-course-callback-signing-secret}
      RECEIVER_DATABASE: /data/receiver.sqlite3
    ports:
      - "${RECEIVER_PORT:-58080}:8080"
    volumes:
      - receiver-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  python-migrate:
    profiles: ["python"]
    build: ./tracks/python-fastapi
    command: ["analysis-migrate", "migrate", "--migrations", "/app/migrations", "--target", "${MIGRATION_TARGET:-002}"]
    environment: &python-env
      DATABASE_URL: postgresql://analysis:${POSTGRES_PASSWORD:-analysis}@postgres:5432/analysis_python
      ARTIFACT_ROOT: /data/artifacts
      REMOTE_FIXTURE_ROOT: /app/fixtures/remote
      WEBHOOK_TRANSPORT_BASE: http://receiver:8080
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-course-training-encryption-key}
      CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET:-course-callback-signing-secret}
      SERVICE_RELEASE: ${SERVICE_RELEASE:-1.0}
      MIGRATION_TARGET: ${MIGRATION_TARGET:-002}
    depends_on:
      postgres:
        condition: service_healthy

  python-api:
    profiles: ["python"]
    build: ./tracks/python-fastapi
    environment: *python-env
    ports:
      - "${PYTHON_API_PORT:-58000}:8000"
    volumes:
      - python-artifacts:/data/artifacts
    depends_on:
      python-migrate:
        condition: service_completed_successfully
      receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  python-worker:
    profiles: ["python"]
    build: ./tracks/python-fastapi
    command: ["analysis-worker"]
    environment: *python-env
    volumes:
      - python-artifacts:/data/artifacts
    depends_on:
      python-migrate:
        condition: service_completed_successfully
      receiver:
        condition: service_healthy

  typescript-migrate:
    profiles: ["typescript"]
    build: ./tracks/typescript-fastify
    command: ["node", "dist/src/migrate.js"]
    environment: &typescript-env
      DATABASE_URL: postgresql://analysis:${POSTGRES_PASSWORD:-analysis}@postgres:5432/analysis_typescript
      ARTIFACT_ROOT: /data/artifacts
      REMOTE_FIXTURE_ROOT: /app/fixtures/remote
      WEBHOOK_TRANSPORT_BASE: http://receiver:8080
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-course-training-encryption-key}
      CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET:-course-callback-signing-secret}
      SERVICE_RELEASE: ${SERVICE_RELEASE:-1.0}
      MIGRATION_TARGET: ${MIGRATION_TARGET:-002}
    depends_on:
      postgres:
        condition: service_healthy

  typescript-api:
    profiles: ["typescript"]
    build: ./tracks/typescript-fastify
    environment: *typescript-env
    ports:
      - "${TYPESCRIPT_API_PORT:-58001}:8001"
    volumes:
      - typescript-artifacts:/data/artifacts
    depends_on:
      typescript-migrate:
        condition: service_completed_successfully
      receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 3s
      retries: 30

  typescript-worker:
    profiles: ["typescript"]
    build: ./tracks/typescript-fastify
    command: ["node", "dist/src/worker.js"]
    environment: *typescript-env
    volumes:
      - typescript-artifacts:/data/artifacts
    depends_on:
      typescript-migrate:
        condition: service_completed_successfully
      receiver:
        condition: service_healthy

volumes:
  postgres-data:
  receiver-data:
  python-artifacts:
  typescript-artifacts:
