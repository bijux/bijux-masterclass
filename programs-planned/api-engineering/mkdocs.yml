site_name: API Engineering
site_description: Ten-course reader-first API engineering program
docs_dir: .
site_dir: site
use_directory_urls: false
strict: true
theme:
  name: material
  features:
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - content.code.copy
markdown_extensions:
- admonition
- attr_list
- def_list
- tables
- toc
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.superfences
exclude_docs: 'README.md

  VERIFICATION.md

  release/**

  scripts/**

  MANIFEST.*

  program.json

  [0-9][0-9]-*/*.md

  [0-9][0-9]-*/assessment/**

  [0-9][0-9]-*/capstone/**

  [0-9][0-9]-*/instructor/**

  [0-9][0-9]-*/predecessor/**

  [0-9][0-9]-*/reports/**

  [0-9][0-9]-*/scripts/**

  [0-9][0-9]-*/tests/**

  [0-9][0-9]-*/release/**'
