[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-events-python-reference"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.3", "jsonschema==4.26.0", "PyYAML==6.0.3"]
api = ["fastapi==0.162.0",
  "starlette==1.3.1", "uvicorn==0.35.0"]
nats = ["nats-py==2.15.0"]
postgres = ["psycopg[binary]==3.2.9"]

[tool.setuptools.packages.find]
where = ["src"]
