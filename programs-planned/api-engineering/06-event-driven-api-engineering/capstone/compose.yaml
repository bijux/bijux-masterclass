services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analysis_events
      POSTGRES_USER: course6
      POSTGRES_PASSWORD: fixture-course6
    ports:
      - "54326:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course6 -d analysis_events"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - course6-postgres:/var/lib/postgresql/data
  nats:
    image: nats:2.14.4-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./broker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - course6-nats:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  course6-postgres: {}
  course6-nats: {}
