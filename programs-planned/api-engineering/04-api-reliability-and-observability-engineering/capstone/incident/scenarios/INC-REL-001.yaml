requiredActions:
- Confirm accepted submissions are durable.
- Recover expired leases without disabling fencing.
- Restore telemetry independently.
- Run read-only reconciliation.
- Validate SLO recovery.
- Write a blameless review with owned follow-up.
closureCriteria:
- Run-start SLO healthy in both windows.
- No target reconciliation finding.
- Telemetry gap documented.
- Follow-up owners assigned.
