[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "analysis-service-python-security"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.3.1",
  "pydantic==2.13.4",
  "psycopg[binary,pool]==3.3.4",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "uvicorn==0.48.0",
  "PyJWT==2.15.1",
  "cryptography==50.0.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.12.11",
]

[project.scripts]
analysis-migrate = "analysis_service.cli:main"
analysis-worker = "analysis_service.worker:main"
security-fixture-issuer = "api_security.fixture_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_service", "src/api_security"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "tests_security"]
