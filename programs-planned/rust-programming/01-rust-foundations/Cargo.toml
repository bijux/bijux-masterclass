[workspace]
resolver = "3"
members = [
    "capstone",
    "labs/module-01-measurement-report/solution",
    "labs/module-02-control-flow-policy/solution",
    "labs/module-03-ownership-intake/solution",
    "labs/module-04-borrowed-catalog/solution",
    "labs/module-05-state-machine/solution",
    "labs/module-06-in-memory-board/solution",
    "labs/module-07-record-codec/solution",
    "labs/module-08-traits-and-lifetimes/solution",
    "labs/module-09-library-boundaries/solution",
    "labs/module-10-inventory-ledger/solution",
]
exclude = [
    "labs/module-01-measurement-report/starter",
    "labs/module-02-control-flow-policy/starter",
    "labs/module-03-ownership-intake/starter",
    "labs/module-04-borrowed-catalog/starter",
    "labs/module-05-state-machine/starter",
    "labs/module-06-in-memory-board/starter",
    "labs/module-07-record-codec/starter",
    "labs/module-08-traits-and-lifetimes/starter",
    "labs/module-09-library-boundaries/starter",
    "labs/module-10-inventory-ledger/starter",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
