[workspace]
resolver = "3"
members = [
    "capstone",
    "labs/module-01-checked-frame-codec/solution",
    "labs/module-02-atomic-archive-store/solution",
    "labs/module-03-sandboxed-extraction-paths/solution",
    "labs/module-04-bounded-process-capture/solution",
    "labs/module-05-unsafe-slice-kernel/solution",
    "labs/module-06-panic-safe-batch-builder/solution",
    "labs/module-07-aligned-byte-buffer/solution",
    "labs/module-08-c-abi-archive-validator/solution",
    "labs/module-09-opaque-foreign-session/solution",
    "labs/module-10-systems-boundary-audit/solution",
]
exclude = [
    "labs/module-01-checked-frame-codec/starter",
    "labs/module-02-atomic-archive-store/starter",
    "labs/module-03-sandboxed-extraction-paths/starter",
    "labs/module-04-bounded-process-capture/starter",
    "labs/module-05-unsafe-slice-kernel/starter",
    "labs/module-06-panic-safe-batch-builder/starter",
    "labs/module-07-aligned-byte-buffer/starter",
    "labs/module-08-c-abi-archive-validator/starter",
    "labs/module-09-opaque-foreign-session/starter",
    "labs/module-10-systems-boundary-audit/starter",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
