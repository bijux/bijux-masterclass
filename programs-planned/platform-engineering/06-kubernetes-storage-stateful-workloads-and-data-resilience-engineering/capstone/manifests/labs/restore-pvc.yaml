apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-db-restore
  namespace: atlas-system
spec:
  storageClassName: atlas-rwo-durable
  dataSource:
    name: atlas-db-data-manual
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  accessModes: [ReadWriteOncePod]
  resources:
    requests:
      storage: 20Gi
