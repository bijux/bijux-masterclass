apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-db-default-deny
  namespace: atlas-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: atlas-db
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-db-allow-application
  namespace: atlas-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: atlas-db
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: atlas
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
