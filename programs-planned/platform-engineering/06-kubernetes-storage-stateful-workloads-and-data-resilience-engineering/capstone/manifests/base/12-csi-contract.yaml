apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.atlas.example.invalid
spec:
  attachRequired: true
  podInfoOnMount: true
  storageCapacity: true
  volumeLifecycleModes:
    - Persistent
---
apiVersion: storage.k8s.io/v1
kind: CSIStorageCapacity
metadata:
  name: atlas-zone-a-capacity
  namespace: kube-system
storageClassName: atlas-rwo-durable
nodeTopology:
  matchLabels:
    topology.atlas.example.invalid/zone: zone-a
capacity: 500Gi
maximumVolumeSize: 200Gi
