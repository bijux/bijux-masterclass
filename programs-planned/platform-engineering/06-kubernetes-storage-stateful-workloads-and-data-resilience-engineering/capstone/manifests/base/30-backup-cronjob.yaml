apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-backup
  namespace: atlas-system
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: atlas-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: registry.example.invalid/atlas/backup@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              args: ["backup", "--manifest", "/evidence/manifest.json"]
              env:
                - name: BACKUP_TARGET
                  value: s3://atlas-recovery.invalid/atlas
              volumeMounts:
                - name: evidence
                  mountPath: /evidence
          volumes:
            - name: evidence
              emptyDir:
                sizeLimit: 1Gi
