version: atlas-availability-1.0
api:
  replicas: 3
  strategy:
    maxSurge: 1
    maxUnavailable: 0
    minReadySeconds: 10
    progressDeadlineSeconds: 300
  disruption:
    minAvailable: 2
  limitations:
    - does not prove multi-zone availability
    - does not prove network endpoint propagation
    - does not prove capacity for surge
worker:
  replicas: 1
  reason: queue and storage concurrency are not proven until Course 6
