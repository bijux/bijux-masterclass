apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-worker-spool
  namespace: atlas-system
  labels:
    app.kubernetes.io/name: atlas-worker
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  storageClassName: atlas-durable-course6
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-worker-results
  namespace: atlas-system
  labels:
    app.kubernetes.io/name: atlas-worker
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  storageClassName: atlas-durable-course6
