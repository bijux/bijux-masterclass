apiVersion: v1
kind: Service
metadata:
  name: atlas-api
  namespace: atlas-system
  labels:
    app.kubernetes.io/name: atlas-api
  annotations:
    platform.bijux.dev/ownership: course-05-networking
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/part-of: atlas
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
