apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-worker
  namespace: atlas-system
  labels:
    app.kubernetes.io/name: atlas-worker
    app.kubernetes.io/part-of: atlas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-worker
      app.kubernetes.io/part-of: atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-worker
        app.kubernetes.io/part-of: atlas
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: atlas-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atlas-worker
          image: platform/atlas-worker@sha256:bbd52b30969ebb6fb3568d2ce5c1ebfb420c7bd7a80001f2a1014feaa4d7a036
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: atlas-config
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: ["/usr/local/bin/atlas-worker", "health", "--ready"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            exec:
              command: ["/usr/local/bin/atlas-worker", "health", "--live"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run/atlas
            - name: spool
              mountPath: /var/lib/atlas/spool
            - name: results
              mountPath: /var/lib/atlas/results
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: spool
          persistentVolumeClaim:
            claimName: atlas-worker-spool
        - name: results
          persistentVolumeClaim:
            claimName: atlas-worker-results
