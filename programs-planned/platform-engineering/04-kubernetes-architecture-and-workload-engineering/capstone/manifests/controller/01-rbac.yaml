apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-controller
  namespace: atlas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-controller
  namespace: atlas-system
rules:
  - apiGroups: [platform.bijux.dev]
    resources: [atlasworkloads, atlasworkloads/status, atlasworkloads/finalizers]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlas-controller
  namespace: atlas-system
subjects:
  - kind: ServiceAccount
    name: atlas-controller
    namespace: atlas-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlas-controller
