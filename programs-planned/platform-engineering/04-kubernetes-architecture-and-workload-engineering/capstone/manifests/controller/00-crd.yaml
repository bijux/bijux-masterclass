apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: atlasworkloads.platform.bijux.dev
spec:
  group: platform.bijux.dev
  scope: Namespaced
  names:
    plural: atlasworkloads
    singular: atlasworkload
    kind: AtlasWorkload
    shortNames: [aw]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Generation
          type: integer
          jsonPath: .metadata.generation
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [apiImage, workerImage, configurationRef]
              properties:
                apiImage:
                  type: string
                  pattern: '^.+@sha256:[0-9a-f]{64}$'
                workerImage:
                  type: string
                  pattern: '^.+@sha256:[0-9a-f]{64}$'
                apiReplicas:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 3
                workerReplicas:
                  type: integer
                  minimum: 1
                  maximum: 1
                  default: 1
                configurationRef:
                  type: string
                  minLength: 1
                availabilityClass:
                  type: string
                  enum: [standard, critical]
                  default: standard
            status:
              type: object
              properties:
                observedGeneration: {type: integer}
                childDeployments:
                  type: array
                  items: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, observedGeneration, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer}
                      lastTransitionTime: {type: string, format: date-time}
