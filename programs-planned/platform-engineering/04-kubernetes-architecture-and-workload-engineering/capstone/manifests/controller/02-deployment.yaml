apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-controller
  namespace: atlas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-controller
    spec:
      serviceAccountName: atlas-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: platform/atlas-controller@sha256:682d7ca588cea70a6827a12cfc3704a2104870a519012f8d547c09ff4b135c2e
          args: ["serve"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
