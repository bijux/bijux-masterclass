apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-observation
  namespace: atlas-system
  annotations:
    platform.bijux.dev/evidence-class: local-observation-only
spec:
  replicas: 3
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: atlas-observation}
  template:
    metadata:
      labels: {app: atlas-observation}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
