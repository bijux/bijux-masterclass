apiVersion: apps/v1
kind: Deployment
metadata: {name: atlas-root-defect, namespace: atlas-system}
spec:
  selector: {matchLabels: {app: atlas-root-defect}}
  template:
    metadata: {labels: {app: atlas-root-defect}}
    spec:
      containers:
        - name: atlas-api
          image: platform/atlas-api@sha256:6e3b38e88f6ef4252b635b6d199095db46233d7b6f85f3be4384d746386317a7
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
          securityContext: {runAsNonRoot: false, allowPrivilegeEscalation: true, readOnlyRootFilesystem: false, capabilities: {drop: []}}
