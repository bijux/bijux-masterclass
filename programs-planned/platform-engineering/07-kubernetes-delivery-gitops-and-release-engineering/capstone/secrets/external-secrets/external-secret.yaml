apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-runtime-credentials
  namespace: atlas-prod
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: atlas-secret-store
  target:
    name: atlas-runtime-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: atlas
  data:
    - secretKey: database-url
      remoteRef:
        key: atlas-prod/database
        property: url
