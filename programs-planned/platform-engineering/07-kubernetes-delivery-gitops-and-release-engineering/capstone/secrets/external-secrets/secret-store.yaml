apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: atlas-secret-store
  namespace: atlas-prod
spec:
  provider:
    kubernetes:
      remoteNamespace: atlas-secret-source
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: atlas-external-secrets-reader
