apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: atlas-api
  namespace: atlas-prod
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas
      app.kubernetes.io/component: api
  strategy:
    canary:
      stableService: atlas-api-stable
      canaryService: atlas-api-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 5
        - pause: {duration: 10m}
        - analysis:
            templates:
              - templateName: atlas-api-quality
            args:
              - name: service-name
                value: atlas-api-canary
        - setWeight: 25
        - pause: {duration: 20m}
        - analysis:
            templates:
              - templateName: atlas-api-quality
            args:
              - name: service-name
                value: atlas-api-canary
        - setWeight: 50
        - pause: {}
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: atlas-api
      containers:
        - name: api
          image: registry.atlas.test/platform/atlas-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
