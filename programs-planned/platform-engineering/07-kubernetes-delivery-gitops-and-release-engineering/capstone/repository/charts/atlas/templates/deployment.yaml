apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "atlas.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "atlas.name" . }}
    spec:
      serviceAccountName: atlas-api
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.runAsUser }}
        runAsGroup: {{ .Values.security.runAsUser }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /ready, port: http}
          livenessProbe:
            httpGet: {path: /live, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            capabilities: {drop: [ALL]}
