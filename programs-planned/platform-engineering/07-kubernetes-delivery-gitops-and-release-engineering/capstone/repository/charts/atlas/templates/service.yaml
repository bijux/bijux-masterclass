apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "atlas.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
