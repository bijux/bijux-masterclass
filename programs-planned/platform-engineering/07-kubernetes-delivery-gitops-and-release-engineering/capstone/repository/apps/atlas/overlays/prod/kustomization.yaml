apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: atlas-prod
nameSuffix: -prod
labels:
  - pairs:
      platform.atlas.dev/environment: prod
      delivery.atlas.dev/release: atlas-1-7-0
    includeSelectors: false
images:
  - name: registry.atlas.test/platform/atlas-api
    newName: registry.atlas.test/platform/atlas-api
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - name: registry.atlas.test/platform/atlas-worker
    newName: registry.atlas.test/platform/atlas-worker
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
replicas:
  - name: atlas-api
    count: 3
patches:
  - path: patch-config.yaml
  - path: patch-rollout.yaml
