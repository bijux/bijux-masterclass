apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-worker
  namespace: atlas
  annotations:
    delivery.atlas.dev/owner: application-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: atlas-worker
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.atlas.test/platform/atlas-worker@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: atlas-runtime
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-runtime-credentials
                  key: database-url
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec: {command: ["/atlas-worker", "health", "--ready"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["/atlas-worker", "health", "--live"]}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 2Gi
