apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atlas-staging
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  timeout: 5m
  path: ./capstone/repository/apps/atlas/overlays/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: atlas-environment
  dependsOn:
    - name: atlas-infrastructure
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: atlas-api-staging
      namespace: atlas-staging
