apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: atlas-charts
  namespace: flux-system
spec:
  interval: 10m
  url: https://charts.example.invalid/atlas
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atlas-api
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: atlas-dev
  releaseName: atlas-api
  chart:
    spec:
      chart: atlas
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: atlas-charts
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      strategy: rollback
  values:
    namespace: atlas-dev
    replicas: 1
    image:
      repository: registry.atlas.test/platform/atlas-api
      digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    service: {port: 80, targetPort: 8080}
    security: {runAsUser: 65532, readOnlyRootFilesystem: true}
