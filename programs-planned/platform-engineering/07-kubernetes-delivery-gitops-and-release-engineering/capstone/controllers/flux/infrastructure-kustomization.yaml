apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atlas-infrastructure
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  path: ./capstone/repository/data/protected
  prune: false
  sourceRef:
    kind: GitRepository
    name: atlas-environment
  wait: true
