apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-schema-compatibility-gate
  namespace: atlas-prod
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: {app.kubernetes.io/name: atlas-schema-compatibility-gate}
    spec:
      restartPolicy: Never
      serviceAccountName: atlas-release-gate
      containers:
        - name: verify
          image: registry.atlas.test/platform/atlas-migration-gate@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          args: ["verify", "--required-phase", "writer-cutover", "--read-only"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
