g atlas-spool - -
g atlas-runtime - -
g atlas-log - -

u atlas-api - "Atlas API" /nonexistent /usr/sbin/nologin
u atlas-worker - "Atlas Worker" /nonexistent /usr/sbin/nologin
u atlas-edge - "Atlas Edge" /nonexistent /usr/sbin/nologin
u atlas-backup - "Atlas Backup" /nonexistent /usr/sbin/nologin

m atlas-api atlas-spool
m atlas-worker atlas-spool
m atlas-backup atlas-spool
m atlas-api atlas-runtime
m atlas-worker atlas-runtime
m atlas-edge atlas-runtime
m atlas-api atlas-log
m atlas-worker atlas-log
m atlas-edge atlas-log
