apiVersion: v1
kind: Service
metadata:
  name: atlas-api
  namespace: atlas-system
  labels:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/part-of: atlas
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  internalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/part-of: atlas
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
