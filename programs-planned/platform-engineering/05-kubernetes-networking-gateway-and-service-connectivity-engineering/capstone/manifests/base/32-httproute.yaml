apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas-api
  namespace: atlas-system
spec:
  parentRefs:
    - name: atlas-public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - atlas.example.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: atlas-api
          port: 8080
