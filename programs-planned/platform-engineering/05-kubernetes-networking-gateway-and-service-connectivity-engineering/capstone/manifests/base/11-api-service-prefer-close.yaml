apiVersion: v1
kind: Service
metadata:
  name: atlas-api-prefer-close
  namespace: atlas-system
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  trafficDistribution: PreferClose
  selector:
    app.kubernetes.io/name: atlas-api
    app.kubernetes.io/part-of: atlas
  ports:
    - name: http
      port: 8080
      targetPort: http
