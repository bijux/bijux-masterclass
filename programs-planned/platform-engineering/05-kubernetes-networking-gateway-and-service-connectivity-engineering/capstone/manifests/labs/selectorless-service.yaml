apiVersion: v1
kind: Service
metadata:
  name: atlas-external-observation
  namespace: atlas-system
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: atlas-external-observation-1
  namespace: atlas-system
  labels:
    kubernetes.io/service-name: atlas-external-observation
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses: ["192.0.2.44"]
    conditions:
      ready: true
