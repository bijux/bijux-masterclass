name: Series Pages

on:
  push:
    branches: [main]
    paths:
      - "programs/README.md"
      - "programs/*/README.md"
      - "programs/*/*/README.md"
      - "programs/*/*/mkdocs.yml"
      - "programs/*/*/course-book/**"
      - "programs/*/*/capstone/docs/**"
      - ".bijux/shared/bijux-docs/**"
      - "docs/**"
      - "configs/docs/**"
      - "makes/root.mk"
      - "makes/docs.mk"
      - "makes/series-docs.mk"
      - "makes/bijux-docs.mk"
      - "scripts/render_root_mkdocs.py"
      - "scripts/sync_series_docs.py"
      - "Makefile"
      - "mkdocs.yml"
      - "mkdocs.shared.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: series-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build series site
        run: |
          make series-docs-build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/site/bijux-masterclass

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
